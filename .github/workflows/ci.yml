name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - name: Lint
        working-directory: apps/web
        run: npx next lint

      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: apps/web
        run: npx vitest run

      - name: Build
        working-directory: apps/web
        run: npx next build

  ios:
    name: iOS (build + test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # macos-26 required (not macos-15): the app's deployment target is iOS 26.0 and uses
      # .glassEffect() (ScoreBadge.swift), a real Xcode 26 / iOS 26 SDK API that doesn't exist
      # on macos-15's Xcode 16.4 (max SDK iOS 18.5) — confirmed live, every push had been
      # failing to even compile since ScoreBadge.swift was added, not a flake. macos-26's
      # default Xcode is 26.5, matching local dev.
      #
      # Concrete simulator required for the test action ('generic/platform=iOS
      # Simulator' only works for a build-only destination). iPhone 16 Pro isn't in
      # macos-26's simulator runtime at all (iPhone 17-series only) — iPhone 17 Pro
      # matches what's used locally.
      - name: Build and run unit tests
        working-directory: apps/ios
        run: |
          xcodebuild -project sillajuku.xcodeproj -scheme sillajuku \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -quiet test
