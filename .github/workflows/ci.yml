name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - name: Lint
        working-directory: apps/web
        run: npx next lint

      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: apps/web
        run: npx vitest run

      - name: Build
        working-directory: apps/web
        run: npx next build

  ios:
    name: iOS (build + test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # macos-26 required (not macos-15): the app's deployment target is iOS 26.0 and uses
      # .glassEffect() (ScoreBadge.swift), a real Xcode 26 / iOS 26 SDK API that doesn't exist
      # on macos-15's Xcode 16.4 (max SDK iOS 18.5) — confirmed live, every push had been
      # failing to even compile since ScoreBadge.swift was added, not a flake. macos-26's
      # default Xcode is 26.5, matching local dev.
      #
      # Concrete simulator required for the test action ('generic/platform=iOS
      # Simulator' only works for a build-only destination). A hardcoded device name has
      # broken CI twice now as GitHub's runner image shifted its bundled simulator lineup
      # (iPhone 16 Pro -> iPhone 17 Pro -> iPhone 17 Pro itself going missing) -- picking
      # whatever iPhone simulator is actually available at run time instead of guessing
      # another fixed name that will just break again on the next image bump.
      - name: Find an available iPhone simulator
        id: sim
        run: |
          echo "Available iOS Simulator runtimes/devices on this runner:"
          xcrun simctl list devices available
          NAME=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone")) | .name' \
            | sort -V | tail -1)
          if [ -z "$NAME" ]; then
            echo "::error::No available iPhone simulator found on this runner"
            exit 1
          fi
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        working-directory: apps/ios
        run: |
          xcodebuild -project sillajuku.xcodeproj -scheme sillajuku \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.name }}' \
            -quiet test
