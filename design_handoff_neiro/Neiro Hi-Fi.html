<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

<body>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">

// ── TOKENS ────────────────────────────────────────────────────────────────────
const C = {
  mint:     '#3DFFD1',
  mintBg:   '#EDFFF9',
  mintDark: '#00453A',
  ink:      '#111111',
  mid:      '#444444',
  muted:    '#888888',
  border:   '#EBEBEB',
  surface:  '#F7F7F5',
  white:    '#FFFFFF',
};

const f = (weight, size, extra={}) => ({
  fontFamily: "'Plus Jakarta Sans', sans-serif",
  fontWeight: weight, fontSize: size, lineHeight: 1.4, ...extra,
});

// ── PRIMITIVES ────────────────────────────────────────────────────────────────

// Album art placeholder — diagonal stripes
let artSeq = 0;
function Art({ size = 160, r = 8, score, style = {} }) {
  const id = React.useRef(`art-${artSeq++}`).current;
  return (
    <div style={{ width: size, height: size, borderRadius: r, overflow: 'hidden',
      flexShrink: 0, position: 'relative', ...style }}>
      <svg width={size} height={size} style={{ display: 'block' }}>
        <defs>
          <pattern id={id} width="10" height="10"
            patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="5" height="10" fill="#EDEDEA" />
            <rect x="5" width="5" height="10" fill="#E2E2DC" />
          </pattern>
        </defs>
        <rect width={size} height={size} fill={`url(#${id})`} />
        <text x="50%" y="54%" textAnchor="middle" dominantBaseline="middle"
          fontFamily="monospace" fontSize={Math.max(8, size * 0.075)} fill="#BBBBB5">
          album art
        </text>
      </svg>
      {score && (
        <div style={{ position: 'absolute', bottom: 6, right: 6,
          background: C.mint, borderRadius: 5, padding: '2px 7px',
          ...f(700, 11), color: C.mintDark }}>
          ★ {score}
        </div>
      )}
    </div>
  );
}

// Square art for grids — uses padding-bottom trick
function ArtSquare({ score, r = 6 }) {
  const id = React.useRef(`arts-${artSeq++}`).current;
  return (
    <div style={{ position: 'relative', width: '100%', paddingBottom: '100%', borderRadius: r, overflow: 'hidden', background: '#EDEDEA' }}>
      <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }}>
        <defs>
          <pattern id={id} width="10" height="10"
            patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="5" height="10" fill="#EDEDEA" />
            <rect x="5" width="5" height="10" fill="#E2E2DC" />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill={`url(#${id})`} />
      </svg>
      {score && (
        <div style={{ position: 'absolute', bottom: 4, right: 4,
          background: C.mint, borderRadius: 4, padding: '1px 6px',
          ...f(700, 10), color: C.mintDark }}>★ {score}</div>
      )}
    </div>
  );
}

// Star rating display
function Stars({ value = 0, size = 14 }) {
  return (
    <div style={{ display: 'flex', gap: 2, flexShrink: 0 }}>
      {[1, 2, 3, 4, 5].map(n => {
        const full = value >= n;
        const half = !full && value >= n - 0.5;
        return (
          <div key={n} style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
            <svg width={size} height={size} viewBox="0 0 12 12">
              <path d="M6 1 L7.3 4.1 L10.8 4.1 L8.0 6.2 L9.0 9.5 L6 7.5 L3.0 9.5 L4.0 6.2 L1.2 4.1 L4.7 4.1 Z"
                fill="#E5E5E0" />
            </svg>
            {(full || half) && (
              <div style={{ position: 'absolute', top: 0, left: 0, overflow: 'hidden', width: half ? '50%' : '100%', height: size }}>
                <svg width={size} height={size} viewBox="0 0 12 12">
                  <path d="M6 1 L7.3 4.1 L10.8 4.1 L8.0 6.2 L9.0 9.5 L6 7.5 L3.0 9.5 L4.0 6.2 L1.2 4.1 L4.7 4.1 Z"
                    fill={C.mint} />
                </svg>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// Avatar
function Avi({ initials = 'M', size = 36 }) {
  return (
    <div style={{ width: size, height: size, borderRadius: '50%',
      background: C.mintBg, border: `2px solid ${C.mint}`,
      display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
      <span style={{ ...f(700, size * 0.36), color: C.mintDark }}>{initials}</span>
    </div>
  );
}

// Chip / badge
function Chip({ children, active }) {
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', padding: '3px 10px',
      borderRadius: 20, background: active ? C.ink : C.surface,
      border: `1.5px solid ${active ? C.ink : C.border}`,
      ...f(600, 11), color: active ? C.white : C.muted, whiteSpace: 'nowrap', cursor: 'pointer' }}>
      {children}
    </span>
  );
}

// Label pill (release type)
function TypePill({ children }) {
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', padding: '2px 9px',
      borderRadius: 20, background: C.surface, border: `1px solid ${C.border}`,
      ...f(500, 11), color: C.muted }}>
      {children}
    </span>
  );
}

// Divider
const HR = ({ my = 0 }) => <div style={{ height: 1, background: C.border, margin: `${my}px 0` }} />;

// Section header row
function SectionHead({ title, sub, action = 'See all →' }) {
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', marginBottom: 18 }}>
      <div>
        <div style={{ ...f(700, 17), color: C.ink }}>{title}</div>
        {sub && <div style={{ ...f(400, 12), color: C.muted, marginTop: 2 }}>{sub}</div>}
      </div>
      {action && <div style={{ ...f(500, 12), color: C.muted, cursor: 'pointer' }}>{action}</div>}
    </div>
  );
}

// Nav with embedded search
function Nav() {
  return (
    <div style={{ height: 60, background: C.white, borderBottom: `1px solid ${C.border}`,
      display: 'flex', alignItems: 'center', padding: '0 36px', gap: 28, flexShrink: 0 }}>
      <div style={{ ...f(800, 16), color: C.ink, letterSpacing: -0.5, whiteSpace: 'nowrap' }}>
        音色 <span style={{ color: C.mint }}>neiro</span>
      </div>
      {/* Search bar */}
      <div style={{ flex: 1, maxWidth: 420 }}>
        <div style={{ background: C.surface, borderRadius: 24, padding: '8px 16px',
          display: 'flex', alignItems: 'center', gap: 8, border: `1px solid ${C.border}` }}>
          <span style={{ color: C.muted, fontSize: 15 }}>⌕</span>
          <span style={{ ...f(400, 13), color: '#C0C0BE' }}>Search albums, artists, users…</span>
        </div>
      </div>
      <div style={{ flex: 1 }} />
      {['Home', 'Activity', 'Lists'].map(p => (
        <span key={p} style={{ ...f(500, 13), color: C.muted, cursor: 'pointer', whiteSpace: 'nowrap' }}>{p}</span>
      ))}
      <Avi initials="MK" size={34} />
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#3DFFD1",
  "surfaceTone": "#F7F7F5"
}/*EDITMODE-END*/;

function App() {
  const [tweakOpen, setTweakOpen] = React.useState(false);
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);

  React.useEffect(() => {
    window.addEventListener('message', e => {
      if (e.data?.type === '__activate_edit_mode') setTweakOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweakOpen(false);
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }, []);

  const setT = (k, v) => {
    setTweaks(t => ({ ...t, [k]: v }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  return (
    <>
      <DesignCanvas>
        <DCSection id="hifi" title="Neiro — Hi-Fi Desktop (1280px)">
          <DCArtboard id="home"    label="01 Homepage"       width={1280} height={980}><HomePage /></DCArtboard>
          <DCArtboard id="album"   label="02 Album Page"     width={1280} height={960}><AlbumPage /></DCArtboard>
          <DCArtboard id="profile" label="03 Profile"        width={1280} height={900}><ProfilePage /></DCArtboard>
          <DCArtboard id="search"  label="04 Search Results" width={1280} height={700}><SearchPage /></DCArtboard>
          <DCArtboard id="auth"    label="05 Sign Up / Login" width={1280} height={820}><AuthPage /></DCArtboard>
        </DCSection>
      </DesignCanvas>

      {tweakOpen && (
        <div style={{ position: 'fixed', bottom: 20, right: 20, background: C.white,
          border: `1px solid ${C.border}`, borderRadius: 12, padding: 18, width: 220,
          boxShadow: '0 4px 24px rgba(0,0,0,0.10)', zIndex: 10000 }}>
          <div style={{ ...f(700, 13), color: C.ink, marginBottom: 16 }}>Tweaks</div>

          <div style={{ marginBottom: 14 }}>
            <div style={{ ...f(600, 11), color: C.muted, textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 8 }}>Accent</div>
            <div style={{ display: 'flex', gap: 8 }}>
              {['#3DFFD1', '#FF6B6B', '#A78BFA', '#FBBF24'].map(col => (
                <div key={col} onClick={() => setT('accentColor', col)}
                  style={{ width: 26, height: 26, borderRadius: 13, background: col, cursor: 'pointer',
                    border: tweaks.accentColor === col ? `2.5px solid ${C.ink}` : '2.5px solid transparent' }} />
              ))}
            </div>
          </div>

          <div>
            <div style={{ ...f(600, 11), color: C.muted, textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 8 }}>Surface</div>
            <div style={{ display: 'flex', gap: 8 }}>
              {['#F7F7F5', '#F5F0E8', '#F0F5FF', '#F0F0F0'].map(col => (
                <div key={col} onClick={() => setT('surfaceTone', col)}
                  style={{ width: 26, height: 26, borderRadius: 4, background: col, cursor: 'pointer',
                    border: tweaks.surfaceTone === col ? `2.5px solid ${C.ink}` : `1px solid ${C.border}` }} />
              ))}
            </div>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<div id="root"></div>
</body>
